methodology:
  id: "point_in_time_v2"
  version: "2.0.0-b5"
  evaluation_design: "rolling_validation"
  information_reconstruction: "availability_correct_latest_vintage"
  status: "provisional_validation_champion_selected"

source:
  path: "data/gold/gold_tourism_demand_monthly.parquet"
  granularity:
    - "territory_id"
    - "month_id"
  target_column: "overnight_stays_total"
  target_month_column: "month_id"
  territory_level: "province"

cutoff_policy:
  id: "conservative_target_lag_3_v1"
  business_origin_lag_months: 1
  latest_available_lag_months: 3
  max_training_target_lag_months: 3

folds:
  - id: "validation_1"
    start: "2021-06"
    end: "2022-05"
    expected_evaluable_rows: 550
    interpretation: "stress_period"
  - id: "validation_2"
    start: "2022-06"
    end: "2023-05"
    expected_evaluable_rows: 600
    interpretation: "rolling_validation"
  - id: "validation_3"
    start: "2023-06"
    end: "2024-05"
    expected_evaluable_rows: 600
    interpretation: "rolling_validation"

baseline:
  id: "seasonal_naive_lag_12"
  role: "historical_validation_baseline"
  target_lag_months: 12
  missing_reference_reason: "missing_seasonal_reference"

candidate:
  id: "seasonal_trend_adjusted_3m_yoy_v1"
  candidate_version: "1.0.0"
  formula_version: "seasonal_anchor_times_raw_3m_yoy_v1"
  screening_status: "rejected_screening"
  window_months: 3
  seasonal_reference_lag_months: 12
  clipping: false
  fallback:
    id: "availability_fallback"
    baseline_id: "seasonal_naive_lag_12"
    performance_based: false

ets_candidate:
  id: "holt_winters_additive_damped_v1"
  candidate_version: "1.0.0"
  library: "statsmodels"
  library_version: "0.14.6"
  scope: "local_per_territory"
  frequency: "monthly"
  trend: "add"
  damped_trend: true
  seasonal: "add"
  seasonal_periods: 12
  initialization_method: "estimated"
  optimized: true
  optimizer: "L-BFGS-B"
  use_brute: false
  remove_bias: false
  use_boxcox: false
  minimum_training_months: 60
  business_horizon_months: 1
  effective_horizon_steps: 3
  gap_policy: "causal_observed_seasonal_lag_12"
  negative_strategy: "clip_zero"
  screening_status: "passed_screening"
  fallback:
    id: "availability_fallback"
    baseline_id: "seasonal_naive_lag_12"
    performance_based: false

operational_selection:
  selected_model_id: "holt_winters_additive_damped_v1"
  status: "provisional_validation_champion"
  evidence_scope: "canonical_rolling_validation"
  independent_test_confirmed: false
  canonical_artifact_path: >-
    data/model_outputs/ets_v2_rolling_validation_predictions.parquet
  canonical_metadata_path: >-
    data/metadata/ets_v2_rolling_validation_predictions.metadata.yml
  canonical_validation:
    artifact_path: >-
      data/model_outputs/ets_v2_rolling_validation_predictions.parquet
    metadata_path: >-
      data/metadata/ets_v2_rolling_validation_predictions.metadata.yml
    artifact_sha256: >-
      7f8a5a44c1204b7c1bfdc5f840e1a58939f8d348ff9e97977dd5d1b0f39fd9c7
    metadata_sha256: >-
      93bf81335aa18d3eed2ba2a0ef1c0d20282d858b0a1e96ec9c6cd5d39a2c9e17
    logical_prediction_sha256: >-
      81515245010068b764eb27ba8bc6e32dffcbc5c590b6b823017d98f0121e8f04
    generator_commit_sha: "3465675af079dc2c9dcfc2f89596c62144e49c76"
    github_run_id: "32359193026"
    official_canonical_artifact: true
    expected_rows: 1750
    expected_territories: 50
    expected_origins: 35
    expected_fold_ids:
      - "validation_1"
      - "validation_2"
      - "validation_3"
    prediction_column: "operational_prediction"
  fallback:
    model_id: "seasonal_naive_lag_12"
    policy: "availability_only"
    performance_based: false

numerical_reproducibility:
  phase: "B4R"
  canonical_environment:
    runner: "ubuntu-24.04"
    python: "3.14.7"
    numpy: "2.5.2"
    scipy: "1.18.0"
    pandas: "3.0.3"
    patsy: "1.0.2"
    statsmodels: "0.14.6"
  local_python_major_minor: "3.14"
  exact_cross_platform_forecasts: false
  policy: "exact_invariants_and_bounded_numerical_approximations"
  forecast_relative_tolerance: 0.00001
  pooled_skill_absolute_tolerance_percentage_points: 1.0
  fold_skill_absolute_tolerance_percentage_points: 2.25
  training_hash_algorithm: "sha256_float64_little_endian"

screening:
  minimum_positive_fold_count: 2
  province_win_fraction_strictly_greater_than: 0.5
  bias_guardrail: "absolute_candidate_bias_not_greater_than_baseline"
  statistical_selection_gate: false

prediction_interval:
  method_id: "prequential_scaled_absolute_residual_interval_v1"
  method_version: "1.0.0"
  baseline_id: "seasonal_naive_lag_12"
  nominal_level: 0.80
  alpha: 0.20
  minimum_calibration_origins: 12
  lower_bound: 0
  calibration_scope: "pooled_territories_expanding_origins"
  quantile_method: "finite_sample_order_statistic"
  transversal_dependence_limitation: true
  exact_iid_coverage_guarantee: false

operational_prediction_interval:
  method_id: "operational_prequential_scaled_absolute_residual_interval_v1"
  method_version: "1.0.0"
  nominal_level: 0.80
  alpha: 0.20
  minimum_calibration_origins: 12
  calibration_scope: "pooled_territories_expanding_origins"
  score_prediction_column: "operational_prediction"
  scale_column: "baseline_prediction"
  source_artifact: >-
    data/model_outputs/ets_v2_rolling_validation_predictions.parquet
  quantile_method: "finite_sample_order_statistic"
  lower_bound: 0
  transversal_dependence_limitation: true
  exact_iid_coverage_guarantee: false

metrics:
  primary: "MAE"
  secondary:
    - "RMSE"
    - "WAPE_pct"
    - "bias"
    - "skill_mae_pct"
  bias_definition: "prediction_minus_actual"
  skill_mae_pct_definition: >-
    100 * (MAE_baseline - MAE_candidate) / MAE_baseline

provenance:
  config_version: "modeling_v2_config_b5_v1"
  code_contract_version: "point_in_time_v2_b5_v1"
  frozen_comparison_path: >-
    data/model_outputs/model_selection_validation_predictions.parquet
  writes_evaluation_artifacts: false
